[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-terminal-operations-assistant"
version = "0.1.0"
description = "Agentic RAG assistant for terminal operations (portfolio project, synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-json-logger>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
